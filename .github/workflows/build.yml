name: Build and Test

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and check tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src test
      - name: Type check
        run: python -m mypy --strict src/lamination_station test
      - name: Regression tests
        run: python -c 'import torch; import pytest; raise SystemExit(pytest.main())'
